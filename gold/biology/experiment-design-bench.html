<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物实验设计台</title><link rel="stylesheet" href="../assets/base.css"><style>
body{background:#263a30;color:#eef2ed}.bench{max-width:1240px;margin:auto;padding:25px 22px 70px}.bench-head{display:flex;justify-content:space-between;gap:20px}.bench-head h1{font:35px var(--serif);margin:0}.validity{padding:12px 16px;border:1px solid #e4bb70;color:#e4bb70;min-width:230px}.validity.valid{background:#cfe3cf;color:#1f4b2c;border-color:#cfe3cf}.apparatus{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.group{background:#e8e2ce;color:#243027;border:4px solid #5e5140;min-height:370px;position:relative;padding:20px}.lamp{position:absolute;right:20px;top:18px;width:54px;height:54px;border-radius:50%;background:#f0ce5f;box-shadow:0 0 30px #e5b941}.group h2{font:28px var(--serif);margin:0}.condition-strip{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.condition-strip span{border:1px solid #796d58;padding:5px 8px;font-size:12px}.tray{position:absolute;left:7%;right:7%;bottom:25px;height:170px;border:7px solid #704b32;border-top:25px solid #8b6546;background:#5c3a28;display:flex;align-items:end;justify-content:space-around;padding:0 8px 20px}.plant{position:relative;width:28px;height:var(--h,95px);border-left:5px solid #36713d}.plant:before,.plant:after{content:"";position:absolute;width:26px;height:15px;background:#4f9452;border-radius:100% 0;left:-28px;top:25px;transform:rotate(18deg)}.plant:after{left:2px;top:48px;transform:scaleX(-1) rotate(18deg)}.plant label{position:absolute;bottom:-19px;font-size:9px;color:#eee;left:-7px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.control{background:#334d3e;border:1px solid #69806f;padding:13px}.control b{display:block;margin-bottom:9px}.toggle{display:flex}.toggle button{flex:1;padding:8px;border:1px solid #829487;background:transparent;color:#fff;cursor:pointer}.toggle button.on{background:#e4bb70;color:#263a30}.confounds{margin:18px 0;background:#1b2c23;padding:15px}.confounds b{color:#e4bb70}.confounds ul{margin:8px 0;line-height:1.6}.runrow{display:flex;align-items:center;gap:12px}.outcome{display:none;margin-top:18px;background:#f0ecdf;color:#243027;padding:18px}.outcome.show{display:grid;grid-template-columns:250px 1fr;gap:22px}.bars{display:flex;align-items:end;gap:25px;height:150px;border-bottom:2px solid}.bar{width:65px;background:#4e8259;text-align:center;padding-top:5px;color:white}.bar.b{background:#7d9d67}.conclusion{border-left:5px solid #9d4036;padding:12px;background:#fff}@media(max-width:850px){.apparatus,.controls{grid-template-columns:1fr}.group{min-height:350px}.outcome.show{grid-template-columns:1fr}}
</style></head><body class="artifact-page"><nav class="artifact-nav"><a class="crumb" href="../../index.html">← 六个课堂成品</a><span class="wordmark">Plant Experiment Bench</span><button class="teacher-toggle">教师控制</button></nav><aside class="teacher-drawer"><h2>教师控制</h2><p>初始设计故意把光照、水量与样本数混在一起。学生的每个修改都会直接改变两张培养盘，而不是只改变一个分数。</p><button onclick="location.reload()">恢复有缺陷的设计</button><p><a href="../../inspector.html">查看底层 skill ↗</a></p></aside><main class="bench"><header class="bench-head"><div><h1>光照时间会影响幼苗生长吗？</h1><p>只能改变一个目标变量，才有资格把组间差异归因给它。</p></div><div class="validity" id="validity"><b>当前：无法隔离光照效应</b><br><small>检查培养盘下方的混杂。</small></div></header><section class="apparatus"><article class="group"><div class="lamp"></div><h2>A 组</h2><div class="condition-strip"><span>光照 12 h</span><span id="water-a">水 20 mL</span><span id="soil-a">壤土</span></div><div class="tray" id="tray-a"></div></article><article class="group"><div class="lamp" style="opacity:.55"></div><h2>B 组</h2><div class="condition-strip"><span>光照 6 h</span><span id="water-b">水 10 mL</span><span id="soil-b">沙土</span></div><div class="tray" id="tray-b"></div></article></section><section class="controls"><div class="control"><b>每株水量</b><div class="toggle"><button data-key="water" data-v="bad" class="on">不同</button><button data-key="water" data-v="good">相同</button></div></div><div class="control"><b>土壤</b><div class="toggle"><button data-key="soil" data-v="bad" class="on">不同</button><button data-key="soil" data-v="good">相同</button></div></div><div class="control"><b>每组重复</b><div class="toggle"><button data-key="rep" data-v="bad" class="on">A=3, B=1</button><button data-key="rep" data-v="good">各 4 株</button></div></div><div class="control"><b>分组方法</b><div class="toggle"><button data-key="random" data-v="bad" class="on">按高矮分</button><button data-key="random" data-v="good">随机分组</button></div></div></section><div class="confounds"><b>当前仍存在的混杂：</b><ul id="confound-list"></ul></div><div class="runrow"><button class="primary" id="run">运行 7 天并测量株高</button><span>测量规则固定：从土面到最高叶尖。</span></div><section class="outcome" id="outcome"><div class="bars"><div class="bar" id="bar-a">A<br>—</div><div class="bar b" id="bar-b">B<br>—</div></div><div class="conclusion" id="conclusion"></div></section></main><script>
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let state={water:'bad',soil:'bad',rep:'bad',random:'bad'};function plants(id,n,base){q(id).innerHTML=Array.from({length:n},(_,i)=>`<div class="plant" style="--h:${base+(i%3)*9}px"><label>${i+1}</label></div>`).join('')}function render(){q('#water-b').textContent=state.water==='good'?'水 20 mL':'水 10 mL';q('#soil-b').textContent=state.soil==='good'?'壤土':'沙土';let n=state.rep==='good'?4:1;plants('#tray-a',state.rep==='good'?4:3,90);plants('#tray-b',n,state.random==='good'?88:68);let labels=[];if(state.water==='bad')labels.push('水量不同：生长差异可能来自水');if(state.soil==='bad')labels.push('土壤不同：保水与养分同时改变');if(state.rep==='bad')labels.push('重复数不等且 B 只有一株');if(state.random==='bad')labels.push('按初始高矮分组：起点系统性不同');q('#confound-list').innerHTML=labels.length?labels.map(x=>`<li>${x}</li>`).join(''):'<li>未发现除光照外的系统差异；现在形成公平比较。</li>';let valid=!labels.length;q('#validity').classList.toggle('valid',valid);q('#validity').innerHTML=valid?'<b>当前：可检验光照效应</b><br><small>两组只保留光照时间不同。</small>':'<b>当前：无法隔离光照效应</b><br><small>还有 '+labels.length+' 个问题。</small>';q('#outcome').classList.remove('show')}qa('.toggle button').forEach(b=>b.onclick=()=>{let p=b.parentElement;p.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');state[b.dataset.key]=b.dataset.v;render()});q('#run').onclick=()=>{let valid=Object.values(state).every(v=>v==='good');q('#outcome').classList.add('show');q('#bar-a').style.height='118px';q('#bar-b').style.height='86px';q('#bar-a').innerHTML='A<br>11.8 cm';q('#bar-b').innerHTML='B<br>8.6 cm';q('#conclusion').innerHTML=valid?'<b>有边界的结论：</b>在本实验的幼苗、7 天观察和相同水土条件下，12 小时光照组平均株高高于 6 小时组。重复实验后才能评价稳定性。':'<b>不能作因果结论：</b>两组虽然出现差异，但光照与当前混杂一起变化。先修复设计，再重跑；结果条形图本身不会替你消除混杂。'};render();q('.teacher-toggle').onclick=()=>q('.teacher-drawer').classList.toggle('open');
</script></body></html>
