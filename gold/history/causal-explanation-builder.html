<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赤壁因果解释工坊</title><link rel="stylesheet" href="../assets/base.css"><style>
body{background:#e9e4da}.builder{min-height:calc(100vh - 64px);padding:25px max(16px,3vw)}.builder-head{display:flex;justify-content:space-between;gap:20px;align-items:end}.builder-head h1{font:36px var(--serif);margin:0}.builder-head p{max-width:600px;color:#5e625f}.board{position:relative;margin-top:22px;border:1px solid #777268;background:#f6f2e8;min-height:530px;display:grid;grid-template-columns:1.05fr 1fr 1fr .8fr;gap:1px}.lane{position:relative;z-index:2;padding:18px;border-right:1px dashed #aaa397}.lane:last-child{border:0}.lane h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 18px}.node{display:block;width:100%;position:relative;z-index:4;background:#fff;border:1px solid #3a4650;margin:0 0 13px;padding:13px;text-align:left;cursor:pointer}.node.selected{outline:3px solid #a23f35}.node.off{opacity:.18;text-decoration:line-through}.node small{display:block;color:#8a3c34;margin-top:5px}.final{background:#293f4d;color:#fff;border-radius:50%;width:130px;height:130px;display:grid;place-items:center;text-align:center;margin:110px auto 0;padding:16px}.final.broken{background:#8b8580;color:#ddd}#edges{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}.edge{stroke:#a23f35;stroke-width:3;fill:none}.edge.broken{stroke:#aaa;stroke-dasharray:7 5}.edge-label{font-size:11px;fill:#17202a}.toolstrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;padding:14px;border:1px solid #aaa397;background:#f6f2e8}.toolstrip button{padding:8px 11px;border:1px solid #555;background:white;cursor:pointer}.toolstrip button.active{background:#273c49;color:#fff}.evidence-bank{margin-left:auto;display:flex;gap:5px}.evidence-chip{background:#e9d39b!important}.diagnosis{min-height:45px;margin:14px 0;padding:12px;border-left:5px solid #a23f35;background:#fff}.counterfactual{display:flex;gap:7px;flex-wrap:wrap}.counterfactual button{background:#e2d7c3}.instructions{font-size:13px}.edge-list{font-size:12px;color:#535a5e}@media(max-width:850px){.builder-head{display:block}.board{grid-template-columns:1fr;min-height:0}.lane{border-right:0;border-bottom:1px dashed}.final{margin:15px auto}.evidence-bank{width:100%;margin-left:0}}
</style></head><body class="artifact-page"><nav class="artifact-nav"><a class="crumb" href="../../index.html">← 六个课堂成品</a><span class="wordmark">赤壁因果解释工坊</span><button class="teacher-toggle">教师控制</button></nav><aside class="teacher-drawer"><h2>教师控制</h2><p>点击一个节点，再点击右侧节点来建立“原因通过机制导致结果”的边。选择一条边后，可绑定史料。反事实不是调低权重，而是移除原因、观察整条路径。</p><button onclick="location.reload()">清空解释</button><p><a href="../../inspector.html">查看底层 skill ↗</a></p></aside><main class="builder"><header class="builder-head"><div><h1>曹操为什么败于赤壁？</h1><p class="instructions">先连接一条完整路径：原因 → 机制 → 中间结果 → 战败风险。然后移除一个原因，检验解释是否仍站得住。</p></div><div class="edge-list" id="edge-list">已建立 0 条因果边</div></header><section class="board" id="board"><svg id="edges" aria-hidden="true"></svg><div class="lane"><h2>背景 / 条件 / 触发</h2><button class="node" id="navy" data-col="0">北方士兵不习水战<small>分类：背景条件</small></button><button class="node" id="disease" data-col="0">军中疫病流行<small>分类：削弱条件</small></button><button class="node" id="supply" data-col="0">长途补给困难<small>分类：背景条件</small></button><button class="node" id="fire" data-col="0">黄盖诈降并纵火<small>分类：触发事件</small></button></div><div class="lane"><h2>机制</h2><button class="node" id="coordination" data-col="1">水军协同下降</button><button class="node" id="strength" data-col="1">有效战斗力下降</button><button class="node" id="mobility" data-col="1">连船使机动受限</button></div><div class="lane"><h2>中间结果</h2><button class="node" id="disorder" data-col="2">遭火攻后难以解脱</button><button class="node" id="numbers" data-col="2">名义人数无法转化为可战兵力</button></div><div class="lane"><h2>需要解释的结果</h2><div class="final" id="final">曹军战败<br>被迫北撤</div></div></section><div class="toolstrip"><b>给选中边绑定史料：</b><div class="evidence-bank"><button class="evidence-chip" data-e="E1">E1 北兵不便水战</button><button class="evidence-chip" data-e="E2">E2 疾疫已起</button><button class="evidence-chip" data-e="E3">E3 火烧连船</button></div></div><div class="diagnosis" id="diagnosis">尚未形成完整解释。不能只把多个“原因”堆在结果旁边。</div><section><h3>反事实拆链</h3><div class="counterfactual"><button data-off="navy">如果北兵擅长水战</button><button data-off="disease">如果军中没有疫病</button><button data-off="fire">如果火攻没有发生</button></div></section></main><script>
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let first=null,edges=[];const final={id:'final',dataset:{col:'3'}};function node(id){return id==='final'?q('#final'):q('#'+id)}function addEdge(a,b){if(edges.some(e=>e.a===a&&e.b===b))return;edges.push({a,b,evidence:''});draw()}qa('.node').forEach(n=>n.onclick=()=>{if(!first){first=n;n.classList.add('selected');return}let from=+first.dataset.col,to=+n.dataset.col;if(to===from+1)addEdge(first.id,n.id);first.classList.remove('selected');first=null});q('#final').onclick=()=>{if(first&&+first.dataset.col===2)addEdge(first.id,'final');if(first)first.classList.remove('selected');first=null};function draw(){let svg=q('#edges'),box=q('#board').getBoundingClientRect();svg.innerHTML='';edges.forEach((e,i)=>{let a=node(e.a).getBoundingClientRect(),b=node(e.b).getBoundingClientRect(),x1=a.right-box.left,y1=a.top+a.height/2-box.top,x2=b.left-box.left,y2=b.top+b.height/2-box.top,broken=node(e.a).classList.contains('off')||node(e.b).classList.contains('off');svg.insertAdjacentHTML('beforeend',`<path class="edge ${broken?'broken':''}" data-i="${i}" d="M${x1},${y1} C${x1+45},${y1} ${x2-45},${y2} ${x2},${y2}"/><text class="edge-label" x="${(x1+x2)/2-12}" y="${(y1+y2)/2-5}">${e.evidence||''}</text>`)});q('#edge-list').textContent=`已建立 ${edges.length} 条因果边 · 点节点连接相邻列`;diagnose()}function diagnose(){let active=edges.filter(e=>!node(e.a).classList.contains('off')&&!node(e.b).classList.contains('off')),reach=new Set(['navy','disease','supply','fire']);for(let z=0;z<4;z++)active.forEach(e=>{if(reach.has(e.a))reach.add(e.b)});let full=reach.has('final'),bound=active.some(e=>e.evidence);q('#final').classList.toggle('broken',!full);q('#diagnosis').textContent=full?(bound?'解释链完整，并有史料绑定。现在用反事实检查：拿走一个原因，机制链是否仍成立？':'解释链已完整，但边上还没有证据；“可能如此”尚未成为有史料约束的解释。'):'尚未形成从原因经机制到结果的完整路径。'}qa('.evidence-chip').forEach(b=>b.onclick=()=>{if(!edges.length)return;edges[edges.length-1].evidence=b.dataset.e;draw()});qa('[data-off]').forEach(b=>b.onclick=()=>{let n=node(b.dataset.off);n.classList.toggle('off');b.classList.toggle('active');draw()});window.onresize=draw;q('.teacher-toggle').onclick=()=>q('.teacher-drawer').classList.toggle('open');
</script></body></html>
